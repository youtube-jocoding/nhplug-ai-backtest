# Optional: copy to .github/workflows/tests.yml with workflow-capable GitHub authorization.
name: Offline tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        python: ['3.10', '3.12']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python bootstrap.py
